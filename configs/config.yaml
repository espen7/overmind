services:
  gateway:
    name: "gateway"
    host: "127.0.0.1"
    port: 8080
  portal:
    name: "portal"
    host: "127.0.0.1"
    port: 8081
  player:
    name: "player"
    host: "127.0.0.1"
    port: 8082
  world:
    name: "world"
    host: "127.0.0.1"
    port: 8083

actors:
  gateway:
    system: "overmind-gateway"
    host: "127.0.0.1"
    port: 9001
    discovery_port: 0
  player:
    system: "overmind-player"
    host: "127.0.0.1"
    port: 9002
    discovery_port: 6332
  world:
    system: "overmind-world"
    host: "127.0.0.1"
    port: 9003
    discovery_port: 6333

cluster:
  name: "overmind-cluster"
  provider: "automanaged"
  hosts:
    - "127.0.0.1:6332"
    - "127.0.0.1:6333"
  refresh_ttl_ms: 2000

mongo:
  uri: "mongodb://127.0.0.1:27017"
  database: "overmind"

world:
  scene:
    width: 1000
    height: 1000
    cell_size: 100

log:
  level: "debug"
  encoding: "console"
