syntax = "proto3";

package auth;

option go_package = "overmind/pkg/pb/auth;authpb";

message LoginRequest {
  string username = 1;
  string password = 2;
}

message LoginResponse {
  string token = 1;
  int64 player_id = 2;
  string player_name = 3;
  int64 scene_id = 4;
  int32 x = 5;
  int32 y = 6;
  int32 error_code = 7;
  string error_message = 8;
}
