syntax = "proto3";

package kit;

option go_package = "overmind/pkg/pb/kit";

// Envelope is the concrete RPC envelope used for process-to-process traffic.
//
// The project intentionally distinguishes three message layers:
// 1. ClientPacket: client <-> gateway transport packet
// 2. Envelope: process <-> process RPC envelope
// 3. LocalCommand / LocalEvent: in-process actor mailbox messages
//
// This proto only models layer 2.
message Envelope {
    string trace_id = 1;
    int64 timestamp = 2;

    oneof payload {
        EdgeLetter edge = 3;
        MeshLetter mesh = 4;
    }
}

// EdgeLetter carries client-facing semantics inside the internal RPC bus.
// It is not the outer ClientPacket itself; gateway may decode a ClientPacket
// first and then wrap the business payload into EdgeLetter.
message EdgeLetter {
    int32 msg_type = 1;
    bytes body = 2;
    int64 session_id = 3;
    string player_id = 4;
    int32 msg_no = 5;
}

// MeshLetter carries internal command/event/control semantics between services.
message MeshLetter {
    string cmd = 1;
    bytes params = 2;
    string sender_service = 3;
    string target_service = 4;
}
